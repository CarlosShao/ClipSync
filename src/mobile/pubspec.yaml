name: clipsync_mobile
description: "ClipSync - Cross-device clipboard synchronization"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0-167.0.dev

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # Routing
  go_router: ^14.0.0

  # Network & API
  http: ^1.2.0
  web_socket_channel: ^3.0.0
  # B2: 离线队列重放的网络状态感知（网络恢复/启动在线触发重放）
  connectivity_plus: ^7.3.1
  
  # Local Storage
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.0.0
  path_provider: ^2.1.0  # T0.2: 由 transitive 转显式（cache_service 使用）

  # State Management
  provider: ^6.1.0

  # Media preview（T2.5 详情页：图片缩放查看 + 网络图片缓存）
  photo_view: ^0.14.0
  cached_network_image: ^3.3.0

  # Utils
  package_info_plus: ^8.0.0
  device_info_plus: ^11.0.0
  crypto: ^3.0.0  # T0.2: 由 transitive 转显式

  # T3.4: 即时通知（本地通知，Android 渠道 clipsync_sync / clipsync_alert）
  flutter_local_notifications: ^17.0.0
  # T3.5: 分享收发（系统分享面板发送 / 接收）
  share_plus: ^10.0.0
  receive_sharing_intent: ^1.8.0

  # T4.6: 生物识别锁（指纹/面容系统验证）
  local_auth: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # T4.5: i18n 基建启用 —— generate 必须位于 flutter: 节点下才对 gen-l10n 生效
  generate: true
  uses-material-design: true
