name: clipsync_mobile
description: "ClipSync - Cross-device clipboard synchronization"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0-167.0.dev

generate: true

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # Routing
  go_router: ^14.0.0

  # Network & API
  http: ^1.2.0
  web_socket_channel: ^3.0.0
  
  # Local Storage
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.0.0
  path_provider: ^2.1.0  # T0.2: 由 transitive 转显式（cache_service 使用）

  # State Management
  provider: ^6.1.0

  # Media preview（T2.5 详情页：图片缩放查看 + 网络图片缓存）
  photo_view: ^0.14.0
  cached_network_image: ^3.3.0

  # Utils
  package_info_plus: ^8.0.0
  device_info_plus: ^11.0.0
  crypto: ^3.0.0  # T0.2: 由 transitive 转显式

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
