<!DOCTYPE html>
<html lang="zh-CN" class="dark" style="background:var(--bg-base)">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClipSync · 快速粘贴</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="qp-body">

<div class="qp-backdrop" id="qpBackdrop"></div>

<div class="qp-win" id="qpWin">
  <div class="qp-search">
    <i data-ic="search"></i>
    <input id="qpInput" placeholder="搜索剪贴记录…" autocomplete="off">
    <kbd>Esc</kbd>
  </div>
  <div class="qp-list" id="qpList"></div>
  <div class="qp-foot">
    <span class="h"><kbd>↑↓</kbd> 选择</span>
    <span class="h"><kbd>↵</kbd> 粘贴</span>
    <span class="h"><kbd>Esc</kbd> 关闭</span>
    <span class="grow"></span>
    <span class="h"><i class="pulse"></i>已同步</span>
  </div>
</div>

<script src="mock.js"></script>
<script src="api.js"></script>
<script src="components.js"></script>
<script>
const TYPE_META = {
  text:  { tile: 't-text',  icon: 'type' },
  link:  { tile: 't-link',  icon: 'link-2' },
  code:  { tile: 't-code',  icon: 'code-2' },
  image: { tile: 't-image', icon: 'image' },
  file:  { tile: 't-file',  icon: 'file' },
};

let sel = 0, items = [], closed = false;
const input = document.getElementById('qpInput');
const list = document.getElementById('qpList');
const win = document.getElementById('qpWin');

function render() {
  const q = input.value.trim().toLowerCase();
  items = DB.clips.filter(c => !q || c.content.toLowerCase().includes(q) || (c.title || '').toLowerCase().includes(q));
  if (sel >= items.length) sel = Math.max(0, items.length - 1);
  if (!items.length) {
    list.innerHTML = `<div class="empty" style="margin:8px;padding:36px 16px">
      ${iconSvg('search', 28)}
      <div class="t">没有匹配的剪贴记录</div>
      <div class="d">换个关键词试试，或回主窗口复制新内容</div>
    </div>`;
    return;
  }
  list.innerHTML = items.map((c, i) => {
    const m = TYPE_META[c.type];
    return `<div class="qp-item ${i === sel ? 'sel' : ''}" data-i="${i}">
      <div class="type-tile ${m.tile}" style="width:30px;height:30px">${iconSvg(m.icon, 14)}</div>
      <div class="grow" style="min-width:0">
        <div class="qt">${esc(c.title || c.content)}</div>
        <div class="qm">${esc(c.source)} · ${c.time} · ${c.size}</div>
      </div>
      ${i < 9 ? `<kbd class="qk">${i + 1}</kbd>` : ''}
    </div>`;
  }).join('');
  list.querySelectorAll('.qp-item').forEach(el => {
    el.onclick = () => pick(+el.dataset.i);
    el.onmouseenter = () => { sel = +el.dataset.i; paint(); };
  });
}

function paint() {
  list.querySelectorAll('.qp-item').forEach(el => el.classList.toggle('sel', +el.dataset.i === sel));
  list.querySelector(`[data-i="${sel}"]`)?.scrollIntoView({ block: 'nearest' });
}

function move(d) {
  if (!items.length) return;
  sel = (sel + d + items.length) % items.length;
  paint();
}

function close(cb) {
  if (closed) return;
  closed = true;
  win.style.animation = 'pop .16s ease reverse both';
  document.getElementById('qpBackdrop').style.animation = 'fade .16s ease reverse both';
  setTimeout(() => {
    win.style.display = 'none';
    document.getElementById('qpBackdrop').style.display = 'none';
    cb && cb();
  }, 160);
}

async function pick(i) {
  const c = items[i];
  if (!c) return;
  await copyItem(c.id);
  close(() => toast('已粘贴回冲', 'ok'));
}

document.addEventListener('DOMContentLoaded', () => {
  render();
  input.focus();
  input.addEventListener('input', () => { sel = 0; render(); });
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); move(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
    else if (e.key === 'Enter') { e.preventDefault(); pick(sel); }
    else if (e.key === 'Escape') { e.preventDefault(); close(); }
  });
  document.getElementById('qpBackdrop').onclick = () => close();
});
</script>
</body>
</html>
