<!DOCTYPE html>
<html lang="zh-CN" data-mode="light">
<head>
  <meta charset="UTF-8" />
  <title>08 · Onboarding — Pulse</title>
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-mono/style.css" />
  <link rel="stylesheet" href="../pulse.css" />
  <style>
    body {
      height: 100vh;
      display: grid; place-items: center;
      background:
        radial-gradient(1200px 600px at 30% 30%, var(--accent-tint), transparent 60%),
        radial-gradient(900px 500px at 70% 70%, oklch(70% 0.16 200 / 0.10), transparent 60%),
        var(--surface-0);
    }
    .onb {
      width: 720px;
      max-width: 92vw;
      padding: 56px 64px;
      background: var(--surface-0);
      border: 1px solid var(--hairline);
      border-radius: 24px;
      box-shadow: var(--shadow-3);
      text-align: center;
    }
    .onb .stepper { display: flex; gap: 6px; justify-content: center; margin-bottom: 32px; }
    .onb .stepper .d { width: 28px; height: 4px; border-radius: 2px; background: var(--surface-3); transition: all 200ms; }
    .onb .stepper .d.is-on { background: var(--accent-500); width: 40px; }
    .onb h1 { font-size: 36px; color: var(--text-strong); font-weight: 700; letter-spacing: -0.02em; margin-bottom: 12px; }
    .onb .sub { font-size: var(--type-md); color: var(--text-muted); margin-bottom: 40px; line-height: 1.6; }

    .hue-picker { display: flex; flex-direction: column; align-items: center; gap: 24px; margin-bottom: 40px; }
    .hue-ring-large {
      width: 240px; height: 240px;
      border-radius: 50%;
      background: conic-gradient(
        oklch(70% 0.20 0), oklch(70% 0.20 30), oklch(70% 0.20 60), oklch(70% 0.20 90),
        oklch(70% 0.20 120), oklch(70% 0.20 150), oklch(70% 0.20 180), oklch(70% 0.20 210),
        oklch(70% 0.20 240), oklch(70% 0.20 270), oklch(70% 0.20 300), oklch(70% 0.20 330),
        oklch(70% 0.20 360)
      );
      position: relative;
      cursor: pointer;
      box-shadow: var(--shadow-2);
      transition: transform 200ms var(--ease-spring);
    }
    .hue-ring-large:hover { transform: scale(1.02); }
    .hue-ring-large::after {
      content: '';
      position: absolute; inset: 32px;
      border-radius: 50%;
      background: var(--surface-0);
      box-shadow: inset 0 2px 8px oklch(0% 0 0 / 0.06);
      display: grid; place-items: center;
    }
    .hue-ring-large::before {
      content: 'P';
      position: absolute; inset: 32px;
      display: grid; place-items: center;
      font-size: 56px; font-weight: 800;
      color: var(--accent-500);
      z-index: 1;
    }
    .hue-marker-large {
      position: absolute; left: 50%; top: 8px;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: var(--surface-0);
      border: 4px solid var(--accent-500);
      transform: translateX(-50%) rotate(250deg);
      transform-origin: 50% 112px;
      box-shadow: var(--shadow-1);
    }
    .hue-label {
      font-size: var(--type-sm);
      color: var(--text-muted);
    }
    .hue-label b { color: var(--text-strong); font-weight: 600; font-family: 'Geist Mono', monospace; }

    .onb .actions { display: flex; justify-content: space-between; align-items: center; }
    .onb .actions .grow { flex: 1; }
  </style>
</head>
<body>
  <div class="onb">
    <div class="stepper">
      <div class="d is-on"></div>
      <div class="d is-on"></div>
      <div class="d"></div>
    </div>

    <h1>选一个你的强调色</h1>
    <p class="sub">色相会影响按钮、链接、激活状态和图表强调。<br/>随时可以在「设置 → 外观」调整。</p>

    <div class="hue-picker">
      <div class="hue-ring-large">
        <div class="hue-marker-large"></div>
      </div>
      <div class="hue-label">当前选中 · <b class="mono">250°</b> · 紫蓝</div>
    </div>

    <div class="actions">
      <button class="btn btn-ghost">上一步</button>
      <div class="grow"></div>
      <button class="btn btn-secondary">跳过</button>
      <button class="btn btn-primary">
        下一步
        <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </div>
  </div>
</body>
</html>
