<!DOCTYPE html>
<html lang="zh-CN" data-theme="pulse" data-mode="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pulse · ClipSync Desktop Redesign</title>
  <link rel="preconnect" href="https://rsms.me/" />
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-mono/style.css" />
  <style>
    /* === Pulse Design Tokens (single source of truth) === */
    :root {
      --accent-hue: 250;
      --surface-0: oklch(99% 0 0);
      --surface-1: oklch(98% 0 0);
      --surface-2: oklch(96% 0 0);
      --surface-3: oklch(94% 0 0);
      --surface-inset: oklch(95% 0 0);
      --hairline: oklch(92% 0.005 270);
      --hairline-strong: oklch(86% 0.01 270);

      --accent-300: oklch(78% 0.16 var(--accent-hue));
      --accent-400: oklch(68% 0.18 var(--accent-hue));
      --accent-500: oklch(58% 0.20 var(--accent-hue));
      --accent-600: oklch(50% 0.20 var(--accent-hue));
      --accent-700: oklch(42% 0.18 var(--accent-hue));
      --accent-glow: oklch(58% 0.20 var(--accent-hue) / 0.18);
      --accent-tint: oklch(58% 0.20 var(--accent-hue) / 0.08);

      --text-strong: oklch(22% 0.01 270);
      --text-default: oklch(38% 0.01 270);
      --text-muted: oklch(58% 0.01 270);
      --text-faint: oklch(72% 0.01 270);
      --text-inverse: oklch(99% 0 0);

      --status-success: oklch(64% 0.16 150);
      --status-warn: oklch(72% 0.15 70);
      --status-danger: oklch(60% 0.20 25);
      --status-info: oklch(64% 0.14 230);
      --status-pending: oklch(64% 0.10 280);

      --type-xs: 11px; --type-sm: 12.5px; --type-base: 14px;
      --type-md: 15.5px; --type-lg: 18px; --type-xl: 22px; --type-2xl: 32px;
      --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px; --radius-xl: 20px; --radius-full: 9999px;

      --shadow-1: 0 1px 2px oklch(20% 0.02 270 / 0.06), 0 1px 1px oklch(20% 0.02 270 / 0.04);
      --shadow-2: 0 4px 12px oklch(20% 0.02 270 / 0.08), 0 1px 3px oklch(20% 0.02 270 / 0.05);
      --shadow-3: 0 12px 32px oklch(20% 0.02 270 / 0.12), 0 4px 8px oklch(20% 0.02 270 / 0.06);
      --shadow-glow: 0 0 0 1px oklch(58% 0.20 var(--accent-hue) / 0.3),
                     0 8px 24px oklch(58% 0.20 var(--accent-hue) / 0.18);
      --shadow-inset: inset 0 1px 2px oklch(20% 0.02 270 / 0.05);

      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);

      --rail-w: 60px;
      --baton-h: 56px;
      --halo-w: 280px;
    }

    html[data-mode="dark"] {
      --surface-0: oklch(16% 0.005 270);
      --surface-1: oklch(19% 0.008 270);
      --surface-2: oklch(22% 0.010 270);
      --surface-3: oklch(26% 0.012 270);
      --surface-inset: oklch(14% 0.005 270);
      --hairline: oklch(28% 0.01 270);
      --hairline-strong: oklch(34% 0.012 270);

      --text-strong: oklch(95% 0.01 270);
      --text-default: oklch(80% 0.01 270);
      --text-muted: oklch(60% 0.01 270);
      --text-faint: oklch(45% 0.01 270);
      --text-inverse: oklch(16% 0.005 270);

      --shadow-1: 0 1px 2px oklch(0% 0 0 / 0.4);
      --shadow-2: 0 4px 12px oklch(0% 0 0 / 0.5), 0 1px 3px oklch(0% 0 0 / 0.4);
      --shadow-3: 0 12px 32px oklch(0% 0 0 / 0.6), 0 4px 8px oklch(0% 0 0 / 0.4);
      --accent-glow: oklch(58% 0.20 var(--accent-hue) / 0.28);
      --accent-tint: oklch(58% 0.20 var(--accent-hue) / 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      font-size: var(--type-base);
      color: var(--text-default);
      background: var(--surface-0);
      -webkit-font-smoothing: antialiased;
      font-feature-settings: 'cv11', 'ss01', 'ss03';
    }
    .mono { font-family: 'Geist Mono', 'JetBrains Mono', ui-monospace, monospace; font-feature-settings: 'tnum', 'zero'; }
    button, input, textarea { font: inherit; color: inherit; background: none; border: none; outline: none; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: var(--hairline-strong); border-radius: 999px; border: 2px solid var(--surface-0); }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-faint); }

    /* === Prototype frame (not the app) === */
    .prototype {
      height: 100vh;
      display: grid;
      grid-template-columns: var(--rail-w) 1fr;
      background: var(--surface-1);
    }
    .rail {
      background: var(--surface-0);
      border-right: 1px solid var(--hairline);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 0;
      gap: 4px;
    }
    .rail-mark {
      width: 32px; height: 32px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent-400), var(--accent-600));
      display: grid; place-items: center;
      color: white;
      margin-bottom: 16px;
      box-shadow: var(--shadow-glow);
    }
    .rail-btn {
      width: 40px; height: 40px;
      border-radius: 10px;
      display: grid; place-items: center;
      color: var(--text-muted);
      transition: all 160ms var(--ease-out);
      position: relative;
    }
    .rail-btn:hover { background: var(--surface-2); color: var(--text-strong); }
    .rail-btn.active { background: var(--accent-tint); color: var(--accent-600); }
    .rail-btn.active::before {
      content: ''; position: absolute; left: -10px; top: 10px; bottom: 10px; width: 3px;
      background: var(--accent-500); border-radius: 2px;
    }
    .rail-btn svg { width: 20px; height: 20px; stroke-width: 1.5; }
    .rail-spacer { flex: 1; }
    .rail-mode {
      width: 36px; height: 36px;
      border-radius: 10px;
      display: grid; place-items: center;
      color: var(--text-muted);
      border: 1px solid var(--hairline);
    }
    .rail-mode:hover { color: var(--text-strong); }

    .main {
      display: flex; flex-direction: column;
      min-width: 0;
    }
    .proto-bar {
      height: 36px;
      background: var(--surface-1);
      border-bottom: 1px solid var(--hairline);
      display: flex; align-items: center; gap: 12px;
      padding: 0 16px;
      font-size: var(--type-xs);
      color: var(--text-muted);
    }
    .proto-bar code {
      font-family: 'Geist Mono', monospace;
      background: var(--surface-2);
      padding: 2px 6px; border-radius: 4px;
      color: var(--text-default);
    }
    .proto-bar .grow { flex: 1; }
    .proto-bar a { color: var(--accent-600); }
    .proto-bar a:hover { text-decoration: underline; }

    .stage {
      flex: 1; min-height: 0; display: flex;
    }
    .frame {
      flex: 1; min-width: 0;
      border: 0;
      background: var(--surface-0);
    }

    /* === Shared app primitives (used inside the iframes via shared.css) === */
    .icon { display: inline-block; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</head>
<body>
  <div class="prototype">
    <aside class="rail" id="rail">
      <div class="rail-mark" title="ClipSync · Pulse">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12h3l2 -6l4 12l2 -6h7"/>
        </svg>
      </div>

      <button class="rail-btn active" data-screen="01-stream" title="Stream">
        <svg class="icon" viewBox="0 0 24 24"><path d="M4 6h16M4 12h12M4 18h8"/></svg>
      </button>
      <button class="rail-btn" data-screen="02-collections" title="Collections">
        <svg class="icon" viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg>
      </button>
      <button class="rail-btn" data-screen="03-templates" title="Templates">
        <svg class="icon" viewBox="0 0 24 24"><path d="M4 4h16v4H4zM4 12h10v4H4zM4 20h16"/></svg>
      </button>
      <button class="rail-btn" data-screen="04-devices" title="Devices">
        <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="5" width="14" height="10" rx="1.5"/><path d="M17 9h2.5a1.5 1.5 0 0 1 1.5 1.5v6a1.5 1.5 0 0 1-1.5 1.5H17"/><path d="M7 19h6"/></svg>
      </button>
      <button class="rail-btn" data-screen="05-settings" title="Settings">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <button class="rail-btn" data-screen="06-halo-assistant" title="Halo · Assistant">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 1 9 9c0 3-1.5 5-3 6.5L17 21h-4l-.5-2h-1L11 21H7l-1-2.5C4.5 17 3 15 3 12a9 9 0 0 1 9-9z"/><circle cx="9" cy="11" r="1"/><circle cx="15" cy="11" r="1"/><path d="M9 15c1 1 2 1.5 3 1.5s2-.5 3-1.5"/></svg>
      </button>
      <button class="rail-btn" data-screen="07-command-palette" title="Command Palette">
        <svg class="icon" viewBox="0 0 24 24"><path d="M9 6l-6 6 6 6M15 6l6 6-6 6M14 4l-4 16"/></svg>
      </button>
      <button class="rail-btn" data-screen="08-onboarding" title="Onboarding">
        <svg class="icon" viewBox="0 0 24 24"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>
      </button>
      <button class="rail-btn" data-screen="09-ai" title="AI 全屏">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 1 9 9c0 3-1.5 5-3 6.5L17 21h-4l-.5-2h-1L11 21H7l-1-2.5C4.5 17 3 15 3 12a9 9 0 0 1 9-9z"/><circle cx="9" cy="11" r="1"/><circle cx="15" cy="11" r="1"/><path d="M9 15c1 1 2 1.5 3 1.5s2-.5 3-1.5"/></svg>
      </button>
      <button class="rail-btn" data-screen="10-ai-memory" title="AI 记忆">
        <svg class="icon" viewBox="0 0 24 24"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2z"/></svg>
      </button>
      <button class="rail-btn" data-screen="11-ai-onboarding" title="AI 引导">
        <svg class="icon" viewBox="0 0 24 24"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2zM12 8v6M12 17h.01"/></svg>
      </button>
      <a class="rail-btn" href="ai/ai-quick-actions.html" target="_blank" title="AI 快捷指令">
        <svg class="icon" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9z"/></svg>
      </a>
      <a class="rail-btn" href="playground.html" target="_blank" title="组件操场 · 可点弹窗">
        <svg class="icon" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      </a>

      <div class="rail-spacer"></div>
      <button class="rail-mode" id="modeBtn" title="切换 浅色 / 深色">
        <svg class="icon" viewBox="0 0 24 24" id="modeIcon"><path d="M12 3v2M12 19v2M5 12H3M21 12h-2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/><circle cx="12" cy="12" r="4"/></svg>
      </button>
    </aside>

    <div class="main">
      <div class="proto-bar">
        <strong style="color: var(--text-strong); font-weight: 600;">Pulse</strong>
        <span>·</span>
        <span>ClipSync 桌面端重构原型</span>
        <span class="grow"></span>
        <a href="DESIGN_PROPOSAL.md" target="_blank">📄 DESIGN_PROPOSAL.md</a>
        <a href="design-system.html" target="_blank">🎨 design-system</a>
        <a href="screens/01-stream.html" target="_blank" id="openNew">↗ 独立打开</a>
      </div>
      <div class="stage">
        <iframe class="frame" id="frame" src="screens/01-stream.html" title="Pulse prototype"></iframe>
      </div>
    </div>
  </div>

  <script>
    const frame = document.getElementById('frame');
    const rail = document.getElementById('rail');
    const modeBtn = document.getElementById('modeBtn');
    const modeIcon = document.getElementById('modeIcon');
    const openNew = document.getElementById('openNew');

    rail.addEventListener('click', (e) => {
      const btn = e.target.closest('.rail-btn');
      if (!btn) return;
      rail.querySelectorAll('.rail-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const screen = btn.dataset.screen;
      frame.src = `screens/${screen}.html`;
      openNew.href = `screens/${screen}.html`;
    });

    modeBtn.addEventListener('click', () => {
      const cur = document.documentElement.dataset.mode || 'light';
      const next = cur === 'light' ? 'dark' : 'light';
      document.documentElement.dataset.mode = next;
      if (next === 'dark') {
        modeIcon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
      } else {
        modeIcon.innerHTML = '<path d="M12 3v2M12 19v2M5 12H3M21 12h-2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/><circle cx="12" cy="12" r="4"/>';
      }
    });

    // Hue slider demo via console: document.documentElement.style.setProperty('--accent-hue', 160)
  </script>
</body>
</html>
