apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clipsync-ingress
  namespace: clipsync
  labels:
    app.kubernetes.io/name: clipsync
  annotations:
    # Nginx Ingress 配置
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/websocket-socket-timeout: "3600"
    # TLS 自动签发（需 cert-manager）
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  # ⚠️ 域名与 src/shared/domains.js 保持一致（YAML 无法 import）
  tls:
    - hosts:
        - api.clipchain.top
        - ws.clipchain.top
      secretName: clipsync-tls
  rules:
    - host: api.clipchain.top
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: clipsync-api
                port:
                  number: 80
    - host: ws.clipchain.top
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: clipsync-api
                port:
                  number: 80
---
# 健康检查 Ingress（可选，用于监控）
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clipsync-health
  namespace: clipsync
  annotations:
    nginx.ingress.kubernetes.io/enable-cors: "false"
spec:
  ingressClassName: nginx
  rules:
    # 健康检查复用 api 子域；不再单独占用 health.<domain>
    # 域名与 src/shared/domains.js 保持一致
    - host: api.clipchain.top
      http:
        paths:
          - path: /health
            pathType: Exact
            backend:
              service:
                name: clipsync-api
                port:
                  number: 80
