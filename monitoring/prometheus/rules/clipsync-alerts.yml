# Prometheus 告警规则 - ClipSync
# 定义关键指标的告警条件
#
# CO-02 指标对齐说明：应用层指标以 src/server/src/middleware/metrics.js 实际导出为准：
#   clipsync_requests_total / clipsync_errors_total / clipsync_response_time_seconds{quantile=...}
#   / clipsync_memory_bytes / clipsync_uptime_seconds / clipsync_ws_connections
# 原规则使用的 http_requests_total / http_request_duration_seconds_bucket / ws_active_connections
# 均为应用从未导出的指标名，已全部替换；pg_pool_* / redis_* 两条规则的应用侧指标同样不存在，
# 已改用 blackbox TCP 探测（probe_success）判定数据库/Redis 可达性。

groups:
  - name: clipsync_alerts
    interval: 30s
    rules:
      # 高错误率告警（clipsync_errors_total 仅统计 5xx，clipsync_requests_total 为全部请求）
      - alert: HighErrorRate
        expr: sum(rate(clipsync_errors_total[5m])) / sum(rate(clipsync_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
          service: clipsync
        annotations:
          summary: "高错误率: {{ $value | humanizePercentage }}"
          description: "ClipSync API 错误率超过 5%，持续时间超过 5 分钟"

      # 数据库不可达告警（CO-02：应用从未导出 pg_pool_* 指标，改用 blackbox TCP 探测可达性）
      - alert: DatabaseUnavailable
        expr: probe_success{job="clipsync-db"} == 0
        for: 1m
        labels:
          severity: critical
          service: clipsync
        annotations:
          summary: "数据库不可达"
          description: "blackbox TCP 探测数据库端口失败超过 1 分钟，请检查数据库服务"

      # Redis 不可达告警（CO-02：应用从未导出 redis_connected_* 指标，改用 blackbox TCP 探测可达性）
      - alert: RedisUnavailable
        expr: probe_success{job="clipsync-redis"} == 0
        for: 1m
        labels:
          severity: critical
          service: clipsync
        annotations:
          summary: "Redis 不可达"
          description: "blackbox TCP 探测 Redis 端口失败超过 1 分钟，请检查 Redis 服务"

      # 高响应时间告警（应用导出的是 summary 预计算分位，直接取 quantile，无需 rate/histogram_quantile）
      - alert: HighResponseTime
        expr: clipsync_response_time_seconds{quantile="0.95"} > 2
        for: 5m
        labels:
          severity: warning
          service: clipsync
        annotations:
          summary: "高响应时间: P95 = {{ $value }}s"
          description: "API P95 响应时间超过 2 秒，当前: {{ $value }}s"

      # WebSocket 连接数异常告警（CO-02：gauge 由 ws/server.js 在连接建立/关闭时经 setWsConnections 上报）
      - alert: WebSocketConnectionAnomaly
        expr: clipsync_ws_connections > 1000
        for: 5m
        labels:
          severity: warning
          service: clipsync
        annotations:
          summary: "WebSocket 连接数异常: {{ $value }} 个连接"
          description: "WebSocket 活跃连接数超过 1000，请检查是否有异常连接"

      # 磁盘空间不足告警
      - alert: LowDiskSpace
        expr: node_filesystem_free_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.2
        for: 10m
        labels:
          severity: critical
          service: clipsync
        annotations:
          summary: "磁盘空间不足"
          description: "根分区磁盘剩余空间小于 20%"

      # 内存使用率过高告警
      - alert: HighMemoryUsage
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.2
        for: 5m
        labels:
          severity: warning
          service: clipsync
        annotations:
          summary: "内存使用率过高"
          description: "可用内存小于 20%，当前: {{ $value | humanizePercentage }}"

      # CPU 使用率过高告警
      - alert: HighCpuUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 10m
        labels:
          severity: warning
          service: clipsync
        annotations:
          summary: "CPU 使用率过高: {{ $value }}%"
          description: "CPU 使用率超过 80%，持续时间超过 10 分钟"

      # 订阅到期告警（需在应用层实现）
      # - alert: SubscriptionExpiring
      #   expr: time() > (subscription_end_date - 86400 * 7)
      #   for: 1h
      #   labels:
      #     severity: info
      #     service: clipsync
      #   annotations:
      #     summary: "订阅即将到期"
      #     description: "用户 {{ $labels.user_id }} 的订阅将在 7 天内到期"
