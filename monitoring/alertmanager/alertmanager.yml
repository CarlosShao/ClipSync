# Alertmanager 配置文件
# 告警通知到飞书群（自定义机器人 Webhook）
#
# 说明：Alertmanager 的 webhook 格式与飞书机器人接口格式不同，
# 需要经过本地转发服务 alertmanager-webhook-feishu 转换后再发给飞书。
# 转发服务由 docker-compose.monitoring.yml 中的 feishu-webhook 服务提供。
# 飞书机器人 Webhook / 签名密钥在 compose 的环境变量里配置。

global:
  # 邮件配置（需配置 SMTP）
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'clipsync-alert@example.com'
  smtp_auth_username: 'clipsync-alert@example.com'
  smtp_auth_password: 'YOUR_APP_PASSWORD'

# 告警路由
route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default-receiver'
  routes:
    # 严重告警 → 立即通知
    - match:
        severity: critical
      receiver: 'critical-receiver'
      group_wait: 0s

    # 警告级告警 → 延迟通知
    - match:
        severity: warning
      receiver: 'warning-receiver'
      group_wait: 30s

# 接收器
receivers:
  - name: 'default-receiver'
    # 邮件通知
    email_configs:
      - to: 'ops-team@example.com'
        subject: '[ClipSync告警] {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          - 告警: {{ .Annotations.summary }}
            描述: {{ .Annotations.description }}
            时间: {{ .StartsAt }}
          {{ end }}
    # 飞书群通知（经转发服务转换）
    webhook_configs:
      - url: 'http://feishu-webhook:8060'
        send_resolved: true

  - name: 'critical-receiver'
    email_configs:
      - to: 'ops-team@example.com,oncall@example.com'
        subject: '🚨 [紧急] ClipSync告警: {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          - 告警: {{ .Annotations.summary }}
            描述: {{ .Annotations.description }}
            时间: {{ .StartsAt }}
          {{ end }}
    # 飞书群通知（经转发服务转换）
    webhook_configs:
      - url: 'http://feishu-webhook:8060'
        send_resolved: true

  - name: 'warning-receiver'
    email_configs:
      - to: 'ops-team@example.com'
        subject: '⚠️ [警告] ClipSync告警: {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          - 告警: {{ .Annotations.summary }}
            描述: {{ .Annotations.description }}
            时间: {{ .StartsAt }}
          {{ end }}
    # 飞书群通知（经转发服务转换）
    webhook_configs:
      - url: 'http://feishu-webhook:8060'
        send_resolved: true

# 抑制规则（可选）
inhibit_rules:
  # 同类告警，critical 抑制 warning
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
