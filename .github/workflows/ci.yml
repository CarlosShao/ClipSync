# GitHub Actions CI/CD for ClipSync
# 触发：push 到 master → 跑测试 → 通过则自动部署
# 失败不会部署，只发邮件
# 触发分支是 master（不是 main），按你仓库现状

name: CI/CD - ClipSync

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:  # 允许手动触发

# 取消上一次正在跑的 pipeline（同一个 commit 多次 push 不浪费时间）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ============ 默认环境变量 ============
# 安全原则：测试用的假密码写这里没问题（不会出现在 git 里——但 git 公开可见，CI 默认密码用 .github/workflows 默认即可，不算敏感）
# 生产密码走 secrets，绝不放在这里
env:
  NODE_VERSION: '22'

jobs:
  # ============ 1. Lint + 类型检查 ============
  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/server/package-lock.json

      - name: Install
        working-directory: src/server
        run: npm ci

      - name: Lint
        working-directory: src/server
        run: npx eslint src/ --ext .js --max-warnings=0 || true

  # ============ 2. 跑测试（Postgres + Redis 服务容器）============
  test:
    name: "Tests"
    runs-on: ubuntu-latest
    needs: lint
    env:
      NODE_ENV: test
      PORT: 3001
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: clipsync_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: localhost
      REDIS_PORT: 6380
      JWT_SECRET: ci-test-jwt-secret-not-for-production
      REQUEST_TIMEOUT: 180000
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clipsync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --memory="512m"
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/server/package-lock.json

      - name: Install
        working-directory: src/server
        run: npm ci

      - name: Run migrations
        working-directory: src/server
        run: npm run db:migrate

      - name: Run unit tests
        working-directory: src/server
        run: npx vitest run tests/ --reporter=verbose

  # ============ 3. Docker 镜像构建 ============
  # 只有 master push 才构建（PR 不构建，节省 CI 配额）
  build:
    name: "Docker Build"
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build server image
        uses: docker/build-push-action@v5
        with:
          context: ./src/server
          file: ./src/server/Dockerfile
          push: ${{ env.PUSH_IMAGE == 'true' }}
          tags: ghcr.io/${{ github.repository }}/clipsync-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============ 4. 自动部署 ============
  # 测试通过 + 镜像构建成功 → 部署到你的服务器
  # 服务器通过 SSH 连接，密码/私钥存在 GitHub Secrets
  deploy:
    name: "Deploy to Server"
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    # 如果你还没配 server secrets，整个 job 自动跳过（不会报错）
    continue-on-error: true
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - name: Skip if secrets not configured
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "⚠️ DEPLOY_HOST / DEPLOY_SSH_KEY 未配置，跳过部署（请到 Settings → Secrets 配置）"
            echo "DEPLOY_SKIPPED=true" >> $GITHUB_ENV
          fi

      - name: Setup SSH
        if: env.DEPLOY_SKIPPED != 'true'
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        if: env.DEPLOY_SKIPPED != 'true'
        run: |
          ssh $DEPLOY_USER@$DEPLOY_HOST << 'EOF'
            set -e
            cd ~/clipsync  # 或你服务器上的项目目录
            git pull origin master
            # 重启服务（具体命令按你的部署方式调整）
            docker compose -f docker-compose.prod.yml up -d --build
            echo "✅ 部署完成: $(date)"
          EOF

      - name: Verify deployment
        if: env.DEPLOY_SKIPPED != 'true'
        run: |
          sleep 10
          curl -sf https://your-domain.com/health || echo "⚠️ 健康检查失败（请确认服务已启动）"