name: admin-console

on:
  push:
    branches: ['feature/admin-console', 'dev/cnb', 'main']
    paths:
      - 'src/admin-console/**'
      - '.github/workflows/admin-console.yml'
  pull_request:
    paths:
      - 'src/admin-console/**'
      - '.github/workflows/admin-console.yml'

defaults:
  run:
    working-directory: src/admin-console

jobs:
  verify:
    name: lint / typecheck / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/admin-console/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-console-dist
          path: src/admin-console/dist
          retention-days: 7
